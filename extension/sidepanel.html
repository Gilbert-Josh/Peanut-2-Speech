<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peanut 2 Speech</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <div>
        <div class="eyebrow">LOCAL READER</div>
        <h1>Peanut 2 Speech</h1>
      </div>
      <span id="statusDot" class="status-dot" title="Checking Text-to-speech"></span>
    </header>

    <section class="controls">
      <button id="readPage" class="primary">Read page</button>
      <button id="readSelection">Read selection</button>
      <button id="stop" class="danger">Stop</button>
    </section>

    <section class="source">
      <div class="section-title">Current text</div>
      <div id="sourceTitle" class="source-title">Nothing loaded</div>
      <div id="progressText" class="muted">0 / 0</div>
    </section>

    <section class="player">
      <div class="now-playing">
        <span id="state">Ready</span>
        <strong id="sentencePreview">Select text or read this page.</strong>
      </div>
      <div class="transport">
        <button id="previous" aria-label="Previous sentence">⏮</button>
        <button id="playPause" class="play" aria-label="Play">▶</button>
        <button id="next" aria-label="Next sentence">⏭</button>
      </div>
      <label class="range-row">
        <span>Speed</span>
        <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
        <output id="speedValue">1.00×</output>
      </label>
    </section>

    <section class="settings">
      <label>
        <span>Voice</span>
        <select id="voice">
          <option value="alloy">Alloy</option>
          <option value="ash">Ash</option>
          <option value="ballad">Ballad</option>
          <option value="coral">Coral</option>
          <option value="echo">Echo</option>
          <option value="fable">Fable</option>
          <option value="nova">Nova</option>
          <option value="onyx">Onyx</option>
          <option value="sage">Sage</option>
          <option value="shimmer">Shimmer</option>
        </select>
      </label>
      <label>
        <span>Style</span>
        <select id="style">
          <option value="natural">Natural</option>
          <option value="cheerfully">Cheerfully</option>
          <option value="energetic">Energetic</option>
          <option value="storyteller">Storyteller</option>
          <option value="authoritative">Authoritative</option>
          <option value="calm">Calm</option>
          <option value="whisper">Whisper</option>
          <option value="news-anchor">News anchor</option>
        </select>
      </label>
    </section>

    <section class="connection">
      <span id="connectionText">Checking local TTS…</span>
      <button id="retryHealth">Retry</button>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
